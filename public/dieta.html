<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rozprávka pre teba</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card" style="max-width: 640px">
    <a href="index.html" class="back-link" data-i18n="back_link">&larr; Späť</a>

    <div id="childNotFoundBox" class="error" style="display: none" data-i18n="dieta_child_not_found">Toto dieťa sa nenašlo. Vyber si prosím znova.</div>

    <div id="childContent" style="display: none">
      <h1 data-i18n="dieta_heading">🧸 O čom má byť dnešná rozprávka?</h1>
      <p class="subtitle" id="childGreeting"></p>

      <div class="field">
        <textarea id="promptInput" rows="3" data-i18n-placeholder="dieta_prompt_placeholder" placeholder="Napríklad: o drakovi, ktorý sa bál lietať..." maxlength="300"></textarea>
      </div>

      <div class="actions-row">
        <button id="generateBtn" data-i18n="dieta_generate_btn">✨ Vytvor rozprávku</button>
        <button id="surpriseBtn" class="secondary" data-i18n="dieta_surprise_btn">🎁 Prekvap ma</button>
      </div>
      <div id="errorBox" class="error" style="display: none"></div>

      <div class="story-history">
        <h2 data-i18n="dieta_history_heading">📖 Staršie rozprávky</h2>
        <div id="pastHistoryList"></div>
      </div>

      <div id="storyBox" style="display: none">
        <div id="storyText" class="story-text"></div>
        <div class="actions-row">
          <button id="readBtn" data-i18n="dieta_read_btn">🔊 Prečítať nahlas</button>
          <button id="stopBtn" class="secondary" style="display: none" data-i18n="dieta_stop_btn">⏹ Zastaviť</button>
          <button id="newStoryBtn" class="secondary" data-i18n="dieta_new_story_btn">📝 Nová rozprávka</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/sound-effects.js"></script>
  <script src="js/dieta.js"></script>
</body>
</html>
